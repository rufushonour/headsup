name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify tag matches Info.plist version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "$TAG_VERSION" != "$PLIST_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString ($PLIST_VERSION) in Resources/Info.plist" >&2
            exit 1
          fi

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Build DMG and generate signed appcast entry
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./Scripts/release.sh

      - name: Commit updated appcast.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- appcast.xml; then
            git add appcast.xml
            git commit -m "Release ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          gh release create "$GITHUB_REF_NAME" \
            "build/HeadsUp-${PLIST_VERSION}.dmg" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
